<style>
:root{--bg:#f4f3ef;--card:#fff;--tx:#1f1e1d;--mu:#6b6a66;--bd:rgba(0,0,0,.12);--dn:#c0392b}
@media (prefers-color-scheme: dark){:root{--bg:#1a1a19;--card:#262624;--tx:#ecebe7;--mu:#a3a29d;--bd:rgba(255,255,255,.14);--dn:#f08a7e}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;width:100%;max-width:340px}
h1{font-size:20px;font-weight:600;margin:0 0 4px}.mu{color:var(--mu);font-size:13px;margin:0 0 14px}
input[type=password]{width:100%;box-sizing:border-box;font-size:16px;padding:10px 12px;border:1px solid var(--bd);
border-radius:10px;background:transparent;color:var(--tx)}
label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mu);margin:10px 0 14px}
button{width:100%;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--tx);color:var(--bg)}
.err{color:var(--dn);font-size:13px;min-height:18px;margin-top:8px}
</style></head><body>

  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(S),iterations:N,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(I)},key,u(C));
  return new TextDecoder().decode(pt);
}
async function go(pw,remember){
  try{var h=await open_(pw);}catch(e){
    try{localStorage.removeItem(K)}catch(_){}
    document.getElementById("er").textContent="비밀번호가 맞지 않습니다.";return;}
  try{if(remember)localStorage.setItem(K,pw);else localStorage.removeItem(K)}catch(_){}
  document.open();document.write(h);document.close();
}
document.getElementById("f").addEventListener("submit",function(e){e.preventDefault();
  var pw=document.getElementById("pw").value;
  if(!pw){document.getElementById("er").textContent="비밀번호를 입력하세요.";return}
  go(pw,document.getElementById("rm").checked)});
try{var s=localStorage.getItem(K);if(s)go(s,true)}catch(_){}
